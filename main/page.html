<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d232b;--muted:#5b6673;--card:#fff;--line:#dde2e8;--accent:#0b62c4}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--fg:#e7ebf0;--muted:#9aa5b1;--card:#1c2128;--line:#2c333c;--accent:#5aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px}h1{margin:0 0 2px}p{color:var(--muted);margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#sw{height:110px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;transition:background .15s}
input[type=color]{width:100%;height:54px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
label{display:block;margin:14px 0 4px;color:var(--muted);font-size:.9rem}input[type=range]{width:100%}
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.presets button{height:40px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.off{width:100%;margin-top:12px;padding:9px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;cursor:pointer}
small{display:block;margin-top:14px;color:var(--muted)}
</style></head><body><main>
<h1>Turtle</h1><p>Set the colour of the on-board LED.</p>
<div class="card">
<div id="sw"></div>
<input id="col" type="color" value="#00a0ff" aria-label="Colour">
<div class="presets" id="pre"></div>
<label for="br">Brightness <span id="bv"></span></label>
<input id="br" type="range" min="1" max="100" value="25">
<button class="off" id="off">Turn off</button>
</div>
<small id="info">…</small>
</main>
<script>
const $=id=>document.getElementById(id);let t;
const show=(hex,br)=>{$('sw').style.background=hex;$('bv').textContent=br+' %';};
// One WebSocket carries every step of the slider; without it (or while it reconnects) fall back to plain requests.
let ws=null,pending=null,raf=0,postT;
function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onclose=ws.onerror=()=>{ws=null;setTimeout(connect,1500);};}catch(e){ws=null;}}
connect();
function flush(){raf=0;const m=pending;pending=null;if(m===null)return;
  if(ws&&ws.readyState===1)ws.send(m);
  else{clearTimeout(postT);postT=setTimeout(()=>{const[h,b]=m.split(',');fetch('/api/led?hex='+h+'&brightness='+b,{method:'POST'}).catch(()=>{});},60);}}
function send(){const hex=$('col').value.slice(1),br=$('br').value;show('#'+hex,br);
  pending=hex+','+br;if(!raf)raf=requestAnimationFrame(flush);}
$('col').oninput=send;$('br').oninput=send;
$('off').onclick=()=>{pending='000000,'+$('br').value;flush();show('#000000',$('br').value);$('sw').style.background='var(--bg)';};
['#ff3030','#ff9000','#ffe000','#30d060','#2090ff','#a050ff'].forEach(c=>{const b=document.createElement('button');b.style.background=c;
  b.onclick=()=>{$('col').value=c;send();};$('pre').appendChild(b);});
fetch('/api/led').then(r=>r.json()).then(s=>{const hex='#'+s.hex;$('col').value=hex==='#000000'?'#00a0ff':hex;$('br').value=s.brightness;
  show(hex==='#000000'?'var(--bg)':hex,s.brightness);$('info').textContent='Firmware '+s.fw+' · '+s.host;}).catch(()=>{});
</script></body></html>
